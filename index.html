<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GX Browser</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Tab Strip -->
    <div class="tab-strip">
        <div class="tabs-container" id="tabs-container"></div>
        <div class="new-tab-btn" id="new-tab-btn">+</div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <button class="nav-btn" id="sidebar-toggle">☰</button>
        <button class="nav-btn" id="back-btn">←</button>
        <button class="nav-btn" id="forward-btn">→</button>
        <button class="nav-btn" id="refresh-btn">↻</button>

        <div class="address-bar">
            <input type="text" id="url-input" placeholder="Enter URL">
            <button class="go-btn" id="go-btn">→</button>
        </div>

        <button class="nav-btn" id="bookmark-btn">⭐</button>
        <button class="nav-btn" id="settings-btn">⚙️</button>
    </div>

    <div class="main">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">🚀 Quick Access</div>
            <div class="sidebar-section">
                <h3>Shortcuts</h3>
                <div id="shortcuts-grid"></div>
            </div>
            <div class="sidebar-section">
                <h3>Bookmarks</h3>
                <div id="bookmarks-list"></div>
            </div>
            <div class="sidebar-section">
                <h3>History</h3>
                <div id="history-list"></div>
            </div>
        </div>

        <div class="content-area">
            <div id="iframes-container"></div>

            <div class="loading-overlay" id="loading-overlay">
                <div class="spinner"></div>
                <div id="loading-text">Loading...</div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <div>GX Browser</div>
        <div id="status-right">0 tabs</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
