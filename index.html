<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAB BROWSER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Ambient Background Orbs -->
    <div class="ambient-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Command Palette -->
    <div class="cmd-palette-backdrop" id="cmd-palette-backdrop">
        <div class="cmd-palette" id="cmd-palette">
            <div class="cmd-input-container">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="cmd-input" placeholder="Search or type a URL… (Esc to close)" autocomplete="off">
            </div>
            <div class="cmd-results" id="cmd-results"></div>
        </div>
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen">
        <div class="auth-box">
            <h1>Welcome King 👑</h1>
            <p>Sign in with your Google account to continue</p>
            <button id="login-btn">Sign in with Google</button>
        </div>
    </div>

    <div class="browser-window">

        <!-- Title Bar + Tabs -->
        <div class="titlebar">
            <div class="window-controls">
                <span class="control close"></span>
                <span class="control minimize"></span>
                <span class="control maximize"></span>
            </div>
            <div class="tab-strip" id="tabs-container"></div>
            <button class="new-tab-btn" id="new-tab-btn" title="New Tab (Ctrl+T)"><i class="ph ph-plus"></i></button>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-left">
                <button class="nav-btn" id="sidebar-toggle" title="Toggle Sidebar"><i class="ph ph-list"></i></button>
                <div class="nav-controls">
                    <button class="nav-btn" id="back-btn"    title="Back (Alt+←)"><i class="ph ph-caret-left"></i></button>
                    <button class="nav-btn" id="forward-btn" title="Forward (Alt+→)"><i class="ph ph-caret-right"></i></button>
                    <button class="nav-btn" id="refresh-btn" title="Refresh (Ctrl+R)"><i class="ph ph-arrows-clockwise"></i></button>
                </div>
            </div>

            <div class="address-bar-container">
                <div class="address-bar">
                    <div class="security-badge"><i class="ph ph-house"></i></div>
                    <input type="text" id="url-input"
                           placeholder="Search or enter address — try anything!"
                           autocomplete="off" spellcheck="false">
                    <button class="icon-btn" id="go-btn" title="Go"><i class="ph ph-arrow-right"></i></button>
                    <button class="icon-btn" id="bookmark-btn" title="Bookmark"><i class="ph ph-star"></i></button>
                </div>
            </div>

            <div class="toolbar-right">
                <button class="nav-btn" id="settings-btn" title="Settings"><i class="ph ph-gear"></i></button>
                <button class="nav-btn" id="logout-btn"   title="Logout"><i class="ph ph-sign-out"></i></button>
                <div class="user-avatar">
                    <img src="https://ui-avatars.com/api/?name=User&background=60a5fa&color=fff&bold=true" alt="User">
                </div>
            </div>
        </div>

        <div class="main-body">

            <!-- Sidebar -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <i class="ph ph-rocket-launch text-accent"></i> Quick Access
                </div>
                <div class="sidebar-content">
                    <div class="sidebar-section">
                        <h3>Shortcuts</h3>
                        <div id="shortcuts-grid" class="grid-list"></div>
                    </div>
                    <div class="sidebar-section">
                        <h3>Bookmarks</h3>
                        <div id="bookmarks-list" class="item-list"></div>
                    </div>
                    <div class="sidebar-section">
                        <h3>History</h3>
                        <div id="history-list" class="item-list"></div>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-area">

                <!-- New Tab / Dashboard Page -->
                <div class="dashboard-container" id="dashboard-container">

                    <div class="clock-widget">
                        <div class="time" id="clock-time">00:00</div>
                        <div class="date" id="clock-date">Monday, Jan 1</div>
                    </div>

                    <h2 class="dashboard-greeting" id="dashboard-greeting">Good Day, King 👑</h2>

                    <!-- Big search bar on the dashboard -->
                    <div class="dash-search-wrap">
                        <div class="dash-search-bar">
                            <i class="ph ph-magnifying-glass"></i>
                            <input type="text" id="dash-search-input"
                                   placeholder="Search the web or enter a URL…"
                                   autocomplete="off" spellcheck="false">
                            <button id="dash-search-btn"><i class="ph ph-arrow-right"></i></button>
                        </div>
                        <div class="dash-search-hint">Powered by DuckDuckGo · Press Enter to go</div>
                    </div>

                    <div class="dashboard-grid">
                        <div class="tilt-card" data-url="https://www.youtube.com">
                            <div class="card-icon"><i class="ph ph-youtube-logo" style="color:#ff0000"></i></div>
                            <div class="card-title">YouTube</div>
                        </div>
                        <div class="tilt-card" data-url="https://github.com">
                            <div class="card-icon"><i class="ph ph-github-logo"></i></div>
                            <div class="card-title">GitHub</div>
                        </div>
                        <div class="tilt-card" data-url="https://twitter.com">
                            <div class="card-icon"><i class="ph ph-twitter-logo" style="color:#1da1f2"></i></div>
                            <div class="card-title">Twitter</div>
                        </div>
                        <div class="tilt-card" data-url="https://chat.openai.com">
                            <div class="card-icon"><i class="ph ph-robot" style="color:#10a37f"></i></div>
                            <div class="card-title">ChatGPT</div>
                        </div>
                        <div class="tilt-card" data-url="https://www.reddit.com">
                            <div class="card-icon"><i class="ph ph-reddit-logo" style="color:#ff4500"></i></div>
                            <div class="card-title">Reddit</div>
                        </div>
                        <div class="tilt-card" data-url="https://duckduckgo.com">
                            <div class="card-icon"><i class="ph ph-duck" style="color:#de5833"></i></div>
                            <div class="card-title">DuckDuckGo</div>
                        </div>
                    </div>
                </div>

                <!-- iFrames live here -->
                <div id="iframes-container" class="iframes-wrapper"></div>

                <!-- Loading overlay -->
                <div class="loading-overlay" id="loading-overlay">
                    <div class="loader-container">
                        <div class="spinner"></div>
                        <div class="loading-text">Loading…</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-left"><i class="ph ph-shield-check"></i> SAB Engine v3.0</div>
            <div class="status-right" id="status-right">0 tabs open</div>
        </div>
    </div>

    <!-- Cursor Trail -->
    <div class="cursor-wrapper">
        <div class="circle"></div><div class="circle"></div><div class="circle"></div>
        <div class="circle"></div><div class="circle"></div><div class="circle"></div>
        <div class="circle"></div><div class="circle"></div><div class="circle"></div>
        <div class="circle"></div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
